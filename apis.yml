aid: nexa3d
name: Nexa3D
description: 'Nexa3D was a Ventura, California additive-manufacturing company that built
  ultrafast photopolymer 3D printers (NXE 400, XiP, XiP Pro) around its Lubricant Sublayer
  Photo-curing (LSPc) process, QLS selective-laser-sintering systems, and the NexaX print-preparation
  and print-management software. The company disclosed severe funding challenges in late 2024,
  withdrew from Formnext, scaled back operations, and in July 2025 sold select assets —
  intellectual property, inventory and equipment, but not personnel — to Stratasys, with
  customer support and materials continuity moving to Stratasys subsidiary iSQUARED. Nexa3D
  no longer operates as an independent company: nexa3d.com now 301-redirects to a third-party
  additive-manufacturing materials marketplace, and no public developer portal, API reference,
  or machine-readable specification (OpenAPI, AsyncAPI, GraphQL SDL, MCP manifest, agent card)
  was found on any Nexa3D host, live or archived.'
